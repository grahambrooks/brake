# brake's own fixture contract. `brake.toml` gates it against the merge-base
# with origin/main, so a change here that would break a consumer blocks the
# commit — the tool applied to itself.
openapi: 3.1.0
info:
  title: payments
  version: "1.0"
paths:
  /payments:
    get:
      operationId: listPayments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
  /payments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPayment
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        "404":
          description: No such payment.
components:
  schemas:
    Payment:
      type: object
      required: [id, amount, status]
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: integer
        status:
          type: string
          enum: [pending, settled, failed]
        note:
          type: [string, "null"]
