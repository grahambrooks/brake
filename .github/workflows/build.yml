name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, so new RustSec advisories surface without a push

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --all-features --doc --locked

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain (and rustfmt/clippy) pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: msrv — rust-version is the toolchain we build with
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: rust-version and rust-toolchain.toml agree
        id: floor
        run: |
          set -euo pipefail
          declared=$(grep -m1 -E '^rust-version *=' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 -E '^channel *=' rust-toolchain.toml | cut -d'"' -f2)
          echo "rust-version=$declared  channel=$pinned"
          if [ "$declared" != "$pinned" ]; then
            echo "::error::rust-version ($declared) and rust-toolchain.toml channel ($pinned) have drifted"
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.floor.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      # `cargo +<floor>` explicitly, not bare `cargo`: rust-toolchain.toml would
      # otherwise override whatever was installed and the job would test nothing.
      - run: cargo +${{ steps.floor.outputs.version }} check --all-targets --all-features --locked

  eval-tests:
    name: evaluation matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make eval-tests

  # brake, applied to itself. The repository carries a fixture contract, so the
  # tool gates its own API surface the way it asks consumers to gate theirs.
  self-check:
    name: brake checks itself
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # A merge-base baseline needs history; a shallow clone has none.
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make self-check

  # A tool whose pitch is trust posture should know what it depends on.
  supply-chain:
    name: advisories and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # The library is a product: forge takes it with default-features = false.
  # A build that only compiles with the CLI or MCP features on is a broken
  # obligation to that consumer, and nothing else here would catch it.
  library-only:
    name: library without the CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --no-default-features --locked

  # docs/rules.md is generated; a stale copy sends anyone following a SARIF
  # helpUri to a page that does not describe the rule that fired.
  generated-docs:
    name: generated docs are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked --test docs_match_the_catalogue
