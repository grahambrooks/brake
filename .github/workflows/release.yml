# crates.io publishing for brake.
#
# This follows the tropism template shape but for a single crate. Publishing is
# manual by default (`workflow_dispatch`) with an optional dry-run gate.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run `cargo publish --dry-run` and stop
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Cargo.toml declares ${VERSION}"

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${TAG_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Publish
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice::dry run — nothing will be published"
            cargo publish -p brake --dry-run
            exit 0
          fi
          cargo publish -p brake
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
