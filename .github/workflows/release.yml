# Releasing brake: prebuilt binaries, a GitHub Release, the Homebrew formula,
# and the crates.io publish.
#
# Ordering matters and is deliberate. `build` produces the artefacts, `release`
# publishes them and computes their checksums, `formula` commits a Homebrew
# formula pinned to those checksums, and `publish` pushes to crates.io last —
# it is the irreversible step, so everything that can fail goes before it.
#
# Binaries exist because `cargo install` needs a Rust toolchain, and brake's
# pitch is that it works on a fresh checkout with nothing installed. Requiring
# a compiler to obtain the tool that makes that claim is a poor first
# impression.

name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run `cargo publish --dry-run` and stop
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # One binary per target. `include` rather than a bare matrix because the
  # runner, the archive format and the cross-compilation needs differ per
  # target and pairing them explicitly is easier to read than three lookups.
  build:
    name: ${{ matrix.target }}
    # Only for a real release. A `workflow_dispatch` dry run is about the
    # crates.io package, and building five targets to prove that would cost
    # ten minutes for nothing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            windows: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The only target needing a cross-linker. Installing it unconditionally
      # would slow every Linux build for the benefit of one.
      - name: Install the aarch64 cross-linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `--features mcp` deliberately: the MCP server is off by default to
      # spare a library consumer the async runtime, but someone installing a
      # *binary* wants `brake mcp` to work without rebuilding.
      - name: Build
        run: cargo build --profile dist --locked --features mcp --target ${{ matrix.target }}

      - name: Package (unix)
        if: '!matrix.windows'
        shell: bash
        run: |
          set -euo pipefail
          name="brake-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/dist/brake" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.windows
        shell: bash
        run: |
          set -euo pipefail
          name="brake-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/dist/brake.exe" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          (cd dist && 7z a "../${name}.zip" "${name}") > /dev/null
          sha256sum "${name}.zip" > "${name}.zip.sha256"

      # Proves the artefact runs before it is offered to anyone. A release
      # whose binary does not start is worse than no release.
      - name: Smoke-test the binary
        if: '!matrix.cross'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/dist/brake"
          [ "${{ matrix.windows }}" = "true" ] && binary="${binary}.exe"
          "$binary" --version
          "$binary" explain response-field-removed > /dev/null
          "$binary" mcp --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: brake-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      checksums: ${{ steps.checksums.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - id: checksums
        name: Collect the checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          # Emitted as JSON so the formula job can look a target up by name
          # rather than parsing the same file twice in two shells.
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, pathlib, re
          sums = {}
          for line in pathlib.Path("SHA256SUMS").read_text().splitlines():
              digest, _, name = line.partition("  ")
              name = name.strip()
              match = re.search(r"brake-[^-]+-(.+?)\.(tar\.gz|zip)$", name)
              if match:
                  sums[match.group(1)] = digest.strip()
          print("json=" + json.dumps(sums))
          PYTHON
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  # The formula is committed here rather than to a `homebrew-brake` tap, so
  # the tap command needs an explicit URL. See README.
  formula:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Render Formula/brake.rb
        env:
          CHECKSUMS: ${{ needs.release.outputs.checksums }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p Formula
          VERSION="$VERSION" python3 .github/render-formula.py > Formula/brake.rb
          cat Formula/brake.rb

      - name: Commit it
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet Formula/brake.rb; then
            echo "::notice::formula unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/brake.rb
          git commit -m "chore(release): Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin main

  publish:
    needs: [build, release, formula]
    # crates.io is the irreversible step, so it runs only once the artefacts
    # exist and the formula is committed.
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Cargo.toml declares ${VERSION}"

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${TAG_VERSION}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Publish
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "::notice::dry run — nothing will be published"
            cargo publish -p brake --dry-run
            exit 0
          fi
          cargo publish -p brake
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
